name: Build and validate Corpus Master graph

on:
  push:
    branches:
      - lore/archivo-de-las-contradicciones
      - main
    paths:
      - "Marper-Codice-Juntado (1).txt"
      - "data/lore_seed_v0.4.jsonl"
      - "data/palimpsesto_index_v0.1_part*.jsonl"
      - "corpus/index_palimpsesto.py"
      - "corpus/build_graph.py"
      - "corpus/validate_graph.py"
      - ".github/workflows/validate-corpus-graph.yml"

concurrency:
  group: corpus-master-graph-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curated dataset
        run: python data/validate_lore_dataset.py data/lore_seed_v0.4.jsonl
      - name: Rebuild complete revelation index
        run: python corpus/index_palimpsesto.py
      - name: Build sparse matrix graph
        run: python corpus/build_graph.py
      - name: Validate graph and all 16,848 source records
        run: python corpus/validate_graph.py corpus/graph_v0.4.json --require-complete
      - name: Commit generated index and graph shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/palimpsesto_index_v0.1_part*.jsonl corpus/graph_v0.4.json corpus/graph_v0.4/
          if git diff --cached --quiet; then
            echo "Generated index and graph are already current."
          else
            git commit -m "Build Corpus Master v0.4 matrix graph"
            git push origin "${{ github.ref_name }}"
          fi
