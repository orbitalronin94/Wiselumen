name: Build and validate Corpus Master graph

on:
  push:
    branches:
      - lore/palimpsesto-expansion-v05-final
      - lore/archivo-de-las-contradicciones
      - main
    paths:
      - "Marper-Codice-Juntado (1).txt"
      - "data/lore_seed_v0.5.jsonl"
      - "data/palimpsesto_topic_map_v0.2.jsonl"
      - "data/palimpsesto_index_v0.1_part*.jsonl"
      - "corpus/**"
      - "lore/**"
      - ".github/workflows/validate-corpus-graph.yml"

concurrency:
  group: corpus-master-graph-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  graph:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curated v0.5 dataset
        run: python data/validate_lore_dataset.py data/lore_seed_v0.5.jsonl
      - name: Rebuild complete revelation index
        run: python corpus/index_palimpsesto.py
      - name: Build sparse matrix graph v0.5
        run: python corpus/build_graph.py --dataset data/lore_seed_v0.5.jsonl --topic-map data/palimpsesto_topic_map_v0.2.jsonl --output corpus/graph_v0.5.json --dataset-blob-sha auto
      - name: Validate graph, topic map and all adaptation links
        run: python corpus/validate_graph.py corpus/graph_v0.5.json --require-complete
      - name: Commit generated index and graph shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/palimpsesto_index_v0.1_part*.jsonl corpus/graph_v0.5.json corpus/graph_v0.5/
          if git diff --cached --quiet; then
            echo "Generated v0.5 index and graph are already current."
          else
            git commit -m "[skip ci] Build Corpus Master v0.5 matrix graph"
            git push origin "${{ github.ref_name }}"
          fi
