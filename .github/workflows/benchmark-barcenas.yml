name: Barcenas-LFM3-1.7B — Spanish teacher benchmark

on:
  push:
    branches: [cultistlumen-v1-250m]
    paths:
      - 'scripts/benchmark_barcenas.py'
      - '.github/workflows/benchmark-barcenas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barcenas-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopenblas-dev
      - name: Build llama.cpp with LFM3 support
        run: |
          git clone --depth 1 --branch b11960 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_OPENMP=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_WEBUI=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-server
      - name: Download only the Spanish fine-tune Q4_K_M
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p models/barcenas
          hf download bartowski/Danielbrdz_Barcenas-LFM3-1.7B-GGUF --include '*Q4_K_M.gguf' --local-dir models/barcenas
          MODEL_PATH="$(find models/barcenas -type f -name '*Q4_K_M.gguf' -print -quit)"
          test -n "$MODEL_PATH"
          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          sha256sum "$MODEL_PATH" | tee artifacts-model.sha256
          ls -lh "$MODEL_PATH"
      - name: Start local inference server
        run: |
          mkdir -p artifacts/barcenas-benchmark
          llama.cpp/build/bin/llama-server --model "$MODEL_PATH" --ctx-size 4096 --threads 4 --threads-batch 4 --batch-size 512 --ubatch-size 128 --host 127.0.0.1 --port 8080 --no-webui --jinja > artifacts/barcenas-benchmark/llama-server.log 2>&1 &
          echo $! > artifacts/barcenas-benchmark/server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then echo 'LFM3_SERVER_READY'; exit 0; fi
            sleep 2
          done
          cat artifacts/barcenas-benchmark/llama-server.log
          exit 1
      - name: Run 200 fixed Spanish prompts
        run: python scripts/benchmark_barcenas.py
      - name: Upload raw answers, speed report, and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barcenas-lfm3-1.7b-spanish-benchmark-200
          path: |
            artifacts/barcenas-benchmark/**
            artifacts-model.sha256
          if-no-files-found: warn
          retention-days: 90
