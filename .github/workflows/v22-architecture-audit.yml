name: LUMEN architecture audit - paired 10-step arms
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "9"
      MKL_NUM_THREADS: "9"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run paired 10-step architecture audit
        run: python scripts/benchmark_v22_architecture_audit.py
      - name: Upload paired metrics
        if: always() && hashFiles('architecture-audit-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-architecture-audit
          path: architecture-audit-result.json
          retention-days: 30
