name: LUMEN V2.2 - optimization combinations at 9 threads vs MAIN
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v22-9-thread-combinations.yml"
      - "scripts/benchmark_v22_9_thread_combinations.py"
      - "scripts/benchmark_v22_cpu_hypotheses.py"
      - "Model.py"
      - "Train.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: \${{ matrix.case }} (9 threads vs MAIN)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 23
      matrix:
        case:
          - 01-topk-embedding-projection
          - 02-topk-einsum-projection
          - 03-excitability-scatter-add
          - 04-rope-cast-cache
          - 05-rope-no-stack
          - 06-rmsnorm-square
          - 07-qkv-unbind-first
          - 08-manual-causal-attention
          - 09-skip-token-range-scan
          - 10-ema-foreach
          - 11-cache-clip-parameters
          - 12-cache-active-layer-set
          - 13-logsumexp-loss-weights
          - 14-skip-disabled-autocast
          - combo-top3-04-06-11
          - combo-rope-nostack-rms-ema-clip
          - combo-qkv-rope-rms-ema-clip
          - combo-scatter-qkv-rope-rms-ema-clip
          - combo-skipscan-qkv-rope-rms-ema-clip
          - combo-logsum-qkv-rope-rms-ema-clip
          - combo-active-qkv-rope-rms-ema-clip
          - combo-mlp-scatter-attn-manual-rope-rms-ema-clip
          - combo-mlp-scatter-attn-qkv-rope-rms-ema-clip
          - combo-safe-max
    env:
      OMP_NUM_THREADS: "9"
      MKL_NUM_THREADS: "9"
      TORCH_INTEROP_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run paired 10 + 10 benchmark at 9 threads
        run: python scripts/benchmark_v22_9_thread_combinations.py --case "\${{ matrix.case }}"
      - name: Upload paired metrics
        if: always() && hashFiles('combo-benchmark-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-9threads-\${{ matrix.case }}
          path: combo-benchmark-result.json
          retention-days: 30
