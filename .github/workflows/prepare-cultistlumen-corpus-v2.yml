name: Prepare CULTISTLUMEN corpus V2 candidates

on:
  push:
    branches:
      - cultistlumen-corpus-v2-prep
    paths:
      - ".github/workflows/prepare-cultistlumen-corpus-v2.yml"
      - "scripts/prepare_cultistlumen_corpus_v2.py"
  workflow_dispatch:
    inputs:
      max_output_gb:
        description: "Maximum uncompressed BDH candidate output in GB"
        required: false
        default: "7.5"

permissions:
  contents: read

concurrency:
  group: cultistlumen-corpus-v2-prep
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAX_OUTPUT_GB: ${{ github.event.inputs.max_output_gb || '7.5' }}
      MIN_BDH_CHARS: "800"
    steps:
      - name: Checkout isolated preparation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install streaming dataset dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==3.3.2" "pyarrow==19.0.1"
      - name: Stream, clean and deduplicate BDH-Books and MentorES
        run: python scripts/prepare_cultistlumen_corpus_v2.py
      - name: Upload candidate corpus and audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: cultistlumen-corpus-v2-candidates
          path: corpus_v2_candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
