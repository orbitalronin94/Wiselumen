name: CULTISTLUMEN FAST-512 — holdout 100k

on:
  push:
    branches: [cultistlumen-v1-250m]
    paths:
      - '.github/workflows/cultistlumen-fast512-holdout-100k.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-fast512-holdout-100k
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.18"
      - name: Recover exact 100k checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh run download 46129437846 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-fast512-continuation-to-100000 --dir artifacts/parent
          test -s artifacts/parent/cultistlumen-v1-fast-step-100000.pt
          sha256sum artifacts/parent/cultistlumen-v1-fast-step-100000.pt
      - name: Recover frozen tokenizer and environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 46126706421 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-fast-frozen-inputs --dir artifacts
          test -s artifacts/pip-freeze.txt
          test -s artifacts/frozen/cultist-tokenizer-v1-8192.json
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  artifacts/frozen/cultist-tokenizer-v1-8192.json" | sha256sum --check
      - name: Install frozen dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r artifacts/pip-freeze.txt
      - name: Run fixed 120-prompt holdout at 100k
        run: |
          python -m py_compile scripts/cultistlumen_v1_fast.py scripts/evaluate_cultistlumen_v1_fast_holdout.py
          python scripts/evaluate_cultistlumen_v1_fast_holdout.py --checkpoint artifacts/parent/cultistlumen-v1-fast-step-100000.pt --tokenizer artifacts/frozen/cultist-tokenizer-v1-8192.json --checkpoint-step 100000 --threads 2 --context 128 --max-new-tokens 64 --out-dir artifacts/holdout-100000
      - name: Upload answers and diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: cultistlumen-fast512-step-100000-holdout-120
          path: |
            artifacts/holdout-100000/HOLDOUT_CULTISTLUMEN_V1_FAST_100K.md
            artifacts/holdout-100000/cultistlumen-v1-fast-step-100000-holdout.json
          if-no-files-found: warn
          retention-days: 90
