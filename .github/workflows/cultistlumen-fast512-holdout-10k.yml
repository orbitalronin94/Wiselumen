name: CULTISTLUMEN FAST-512 — fixed holdout 10k (120 prompts)

on:
  push:
    branches: [cultistlumen-v1-250m]
    paths:
      - '.github/workflows/cultistlumen-fast512-holdout-10k.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-fast512-holdout-10k
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.18"
      - name: Recover exact 10k checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent artifacts/frozen
          gh run download 46128054201 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-fast512-step-10000 --dir artifacts/parent
          test -s artifacts/parent/cultistlumen-v1-fast-step-10000.pt
          sha256sum artifacts/parent/cultistlumen-v1-fast-step-10000.pt
      - name: Recover frozen tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 46126706421 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-fast-frozen-inputs --dir artifacts/frozen
          TOKENIZER="$(find artifacts/frozen -name 'cultist-tokenizer-v1-8192.json' -print -quit)"
          test -n "$TOKENIZER"
          echo "TOKENIZER_PATH=$TOKENIZER" >> "$GITHUB_ENV"
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  $TOKENIZER" | sha256sum --check
      - name: Install inference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Evaluate fixed 100+20 holdout
        run: |
          python -m py_compile scripts/cultistlumen_v1_fast.py scripts/evaluate_cultistlumen_v1_fast_holdout.py
          python scripts/evaluate_cultistlumen_v1_fast_holdout.py --checkpoint artifacts/parent/cultistlumen-v1-fast-step-10000.pt --tokenizer "$TOKENIZER_PATH" --threads 2 --context 128 --max-new-tokens 64 --out-dir artifacts/holdout-10k
      - name: Upload literal answers and machine-readable report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: cultistlumen-fast512-step-10000-holdout-120
          path: |
            artifacts/holdout-10k/HOLDOUT_CULTISTLUMEN_V1_FAST_10K.md
            artifacts/holdout-10k/cultistlumen-v1-fast-step-10000-holdout.json
          if-no-files-found: warn
          retention-days: 90
