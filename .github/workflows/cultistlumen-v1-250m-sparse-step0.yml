name: CULTISTLUMEN 250M — sparse FFN 10-step smoke, factual pre-Marper

on:
  push:
    branches: [cultistlumen-v1-250m]
    paths:
      - 'scripts/cultistlumen_v1_sparse.py'
      - 'scripts/train_cultist_v1_sparse_premarper.py'
  workflow_dispatch:
    inputs:
      pool_source_run_id:
        description: "Run ID del artefacto con el pool ya congelado; vacío para construirlo una sola vez"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-sparse-step0
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "1"
  TORCH_INTEROP_THREADS: "1"
  PROFILE: "0"
  SAMPLED_NEGATIVES: "1024"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  STEPS: "10"
  TOTAL_TRAIN_STEPS: "10000"
  WARMUP: "200"
  BASE_LR_MAIN: "0.0008"
  BASE_LR_EMBED: "0.0004"
  BATCH_SIZE: "4"
  CTX: "128"
  MODEL_D_MODEL: "4096"
  MODEL_D_FF: "16544"
  MODEL_N_HEAD: "64"
  MODEL_RANK: "512"
  MAX_CHUNKS_PER_FILE: "2048"
  POOL_ARCHIVE: "artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz"
  POOL_SOURCE_RUN_ID: "${{ inputs.pool_source_run_id }}"

jobs:
  train-premarper:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Recover and verify frozen 8192 tokenizer derived from V4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/frozen artifacts
          gh run download 45998414105 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-step-1000 --dir artifacts/frozen
          test -s artifacts/frozen/cultist-tokenizer-v1-8192.json
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  artifacts/frozen/cultist-tokenizer-v1-8192.json" | sha256sum --check
      - name: Download and verify frozen pre-Marper V4 archive
        run: |
          curl -fL --retry 3 "https://github.com/orbitalronin94/WISE-RONIN/releases/download/corpus-v4.0.0-public-20261125/wise-ronin-corpus-v4.0.0.zip" -o artifacts/wise-ronin-corpus-v4.0.0.zip
          echo "535ae5a1c067f30a93e1ad20e0a8b7e332df5b14558d1dfac7a3e44193de3e9a  artifacts/wise-ronin-corpus-v4.0.0.zip" | sha256sum --check
      - name: Compile trainer and verify tokenizer/model contract
        run: python -m py_compile scripts/cultistlumen_v1_sparse.py scripts/train_cultist_v1_sparse_premarper.py
      - name: Build factual-only token pool (first run only)
        if: ${{ inputs.pool_source_run_id == '' }}
        run: python scripts/train_cultist_v1_sparse_premarper.py --build-pool-only
      - name: Recover previously frozen pool
        if: ${{ inputs.pool_source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/frozen_pool
          gh run download "$POOL_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cultistlumen-v1-sparse-250m-premarper-step-10 --dir artifacts/frozen_pool
          cp artifacts/frozen_pool/cultist-v1-pool-ctx128-premarper.pkl.gz "$POOL_ARCHIVE"
          cp artifacts/frozen_pool/cultist-v1-premarper-pool-manifest.json artifacts/cultist-v1-premarper-pool-manifest.json
      - name: Assert frozen pool provenance and SHA-256
        run: |
          python - <<'PY'
          import gzip, hashlib, json, os, pickle
          from pathlib import Path
          p=Path(os.environ["POOL_ARCHIVE"])
          manifest=json.loads(Path("artifacts/cultist-v1-premarper-pool-manifest.json").read_text())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest==manifest["pool_sha256"], f"pool SHA mismatch: {digest}"
          with gzip.open(p,"rb") as f: x=pickle.load(f)
          m=x["metadata"]
          assert m["corpus_version"]=="v4.0.0-pre-marper"
          assert m["sampling"]=={"world":1.0,"marper":0.0,"conflicts":0.0}
          assert set(x["pools"])=={"world"}
          print("FROZEN_POOL_OK", digest, json.dumps(m, sort_keys=True))
          PY
      - name: Write immutable experiment lock and environment snapshot
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          def sha(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""): h.update(block)
              return h.hexdigest()
          pool=Path(os.environ["POOL_ARCHIVE"])
          tokenizer=Path("artifacts/frozen/cultist-tokenizer-v1-8192.json")
          corpus=Path("artifacts/wise-ronin-corpus-v4.0.0.zip")
          lock={
            "schema":"cultistlumen-experiment-lock-v1",
            "git_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "git_ref":os.environ.get("GITHUB_REF"),
            "run_id":os.environ.get("GITHUB_RUN_ID"),
            "run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            "python":sys.version,
            "platform":platform.platform(),
            "machine":platform.machine(),
            "cpu_count":os.cpu_count(),
            "torch_version":__import__("torch").__version__,
            "tokenizers_version":__import__("tokenizers").__version__,
            "source_sha256":{
              "model":sha("scripts/cultistlumen_v1_sparse.py"),
              "trainer":sha("scripts/train_cultist_v1_sparse_premarper.py"),
              "workflow":sha(".github/workflows/cultistlumen-v1-250m-sparse-step0.yml")
            },
            "inputs_sha256":{
              "tokenizer":sha(tokenizer),
              "corpus_archive":sha(corpus),
              "token_pool":sha(pool)
            },
            "training_config":{k:os.environ.get(k) for k in [
              "STEPS","TOTAL_TRAIN_STEPS","WARMUP","BASE_LR_MAIN","BASE_LR_EMBED",
              "BATCH_SIZE","CTX","MODEL_D_MODEL","MODEL_D_FF","MODEL_N_HEAD",
              "MODEL_RANK","OMP_NUM_THREADS","MKL_NUM_THREADS","OPENBLAS_NUM_THREADS",
              "TORCH_INTEROP_THREADS","SAMPLED_NEGATIVES"
            ]},
            "seed":20261127,
            "pool_archive":str(pool)
          }
          lock["architecture"]={
            "name":"CULTISTLUMEN-V1-SPARSE",
            "vocab":8192,
            "mixer":"GatedDeltaNetLR",
            "ffn":"BlockSparseGatedFFN",
            "ffn_banks":8,
            "ffn_top_k":2,
            "ffn_active_fraction":0.25,
            "weight_tying":True
          }
          lock["optimizer"]={"name":"AdamW","betas":[0.9,0.95],"eps":1e-8,"weight_decay":0.01,"foreach":False}
          Path("artifacts/cultistlumen-experiment-lock.json").write_text(json.dumps(lock,indent=2,sort_keys=True)+"\n")
          PY
          python -m pip freeze > artifacts/pip-freeze.txt
      - name: Train 10 steps from random initialization
        run: python scripts/train_cultist_v1_sparse_premarper.py
      - name: Upload step 10 checkpoint, metrics, frozen pool, and full provenance
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: cultistlumen-v1-sparse-250m-premarper-step-10
          path: |
            artifacts/cultistlumen-v1-sparse-step-10.pt
            artifacts/cultistlumen-v1-sparse-metrics-step-10.json
            artifacts/cultist-v1-premarper-pool-manifest.json
            artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz
            artifacts/cultistlumen-experiment-lock.json
            artifacts/pip-freeze.txt
            artifacts/frozen/cultist-tokenizer-v1-8192.json
            artifacts/wise-ronin-corpus-v4.0.0.zip
          if-no-files-found: warn
          retention-days: 90
