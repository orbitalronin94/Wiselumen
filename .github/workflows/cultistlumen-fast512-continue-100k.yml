name: CULTISTLUMEN FAST-512 — continue 10k to 100k

on:
  push:
    branches: [cultistlumen-v1-250m]
    paths:
      - '.github/workflows/cultistlumen-fast512-continue-100k.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-fast512-continue-100k
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TORCH_INTEROP_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      PROFILE: "0"
      STEPS: "90000"
      TOTAL_TRAIN_STEPS: "100000"
      WARMUP: "200"
      BASE_LR_MAIN: "0.0008"
      BASE_LR_EMBED: "0.0004"
      BATCH_SIZE: "2"
      CTX: "128"
      SAMPLED_NEGATIVES: "256"
      MODEL_D_MODEL: "512"
      MODEL_D_FF: "2048"
      MODEL_RANK: "64"
      MODEL_N_HEAD: "0"
      PARENT_CHECKPOINT: "artifacts/parent/cultistlumen-v1-fast-step-10000.pt"
      POOL_ARCHIVE: "artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz"
      FROZEN_TOKENIZER: "artifacts/frozen/cultist-tokenizer-v1-8192.json"
      OUT_DIR: "artifacts"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.18"
      - name: Recover exact 10k parent checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh run download 46128054201 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-fast512-step-10000 --dir artifacts/parent
          test -s "$PARENT_CHECKPOINT"
          python - <<'PY'
          import torch, os
          p=torch.load(os.environ["PARENT_CHECKPOINT"],map_location="cpu",weights_only=False)
          assert p.get("architecture")=="CULTISTLUMEN-V1-FAST" and p.get("step")==10000
          assert p.get("model_config",{}).get("d_model")==512 and p.get("ctx")==128
          assert p.get("tokenizer_sha256")=="91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e"
          print("PARENT_CHECKPOINT_VERIFIED",p["step"],"optimizer_state=",p.get("optimizer") is not None)
          PY
      - name: Recover frozen pool and tokenizer without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cultistlumen-fast-frozen-inputs
          run-id: 46126706421
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Restore exact environment and verify frozen inputs
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r artifacts/pip-freeze.txt
          test -s "$POOL_ARCHIVE"
          test -s "$FROZEN_TOKENIZER"
          python - <<'PY'
          import hashlib, os, gzip, pickle
          from pathlib import Path
          pool=Path(os.environ["POOL_ARCHIVE"])
          tok=Path(os.environ["FROZEN_TOKENIZER"])
          with gzip.open(pool,"rb") as f: p=pickle.load(f)
          m=p["metadata"]
          assert hashlib.sha256(pool.read_bytes()).hexdigest()=="5e564605766b0a7c7e5b4784c0bf459588ee103c014a9aa2a1007a48cc402b13"
          assert hashlib.sha256(tok.read_bytes()).hexdigest()=="91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e"
          assert m["context"]==128 and m["corpus_version"]=="v4.0.0-pre-marper"
          assert m["sampling"]=={"world":1.0,"marper":0.0,"conflicts":0.0}
          print("FROZEN_INPUTS_VERIFIED",m["corpus_version"],m["sampling"])
          PY
      - name: Compile continuation trainer
        run: python -m py_compile scripts/cultistlumen_v1_fast.py scripts/train_cultist_v1_fast_continue.py
      - name: Continue from 10k through 100k
        run: python scripts/train_cultist_v1_fast_continue.py
      - name: Upload final and latest recovery checkpoint
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: cultistlumen-fast512-continuation-to-100000
          path: |
            artifacts/cultistlumen-v1-fast-step-100000.pt
            artifacts/cultistlumen-v1-fast-metrics-step-100000.json
            artifacts/cultistlumen-v1-fast-recovery-latest.pt
          if-no-files-found: warn
          retention-days: 90
