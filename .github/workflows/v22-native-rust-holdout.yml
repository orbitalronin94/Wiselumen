name: LUMEN V2.2 — Native Rust KV-cache parity at step 32500
run-name: V2.2 native Rust KV-cache — 2 threads — parity with Python main (32.5k)
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  native-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      CXX: clang++
      LIBTORCH_USE_PYTORCH: "1"
      LIBTORCH_BYPASS_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: orbitalronin94/WISE-RONIN
          ref: d2981fdb01f18e88d2c46a7dc47daea6a6e7e3ea
          path: oldrepo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned CPU PyTorch for one-time checkpoint export
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install tokenizers==0.21.0 numpy
          echo "LD_LIBRARY_PATH=$(python -c 'import torch,os; print(os.path.join(os.path.dirname(torch.__file__),"lib"))'):$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Download exact V2.2 step-32500 checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p v22
          gh run download 45953893078 --repo orbitalronin94/Wiselumen --name lumen-v22-v5-fastpath-step-32500 --dir v22
          test -s v22/lumen-v22-v5-fastpath-step-32500.pt
          test -s v22/tokenizer-v22-derived.json
      - name: Download frozen legacy holdout inputs
        uses: actions/download-artifact@v4
        with:
          name: paired-v32-inputs-1000000-45782396142
          path: oldinputs
          repository: orbitalronin94/WISE-RONIN
          run-id: 45782396142
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Python main baseline from the identical checkpoint
        uses: actions/download-artifact@v4
        with:
          name: v22-legacy-plus-v5-generative-holdout-step32500
          path: baseline
          repository: orbitalronin94/Wiselumen
          run-id: 45963096256
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export exact step-32500 checkpoint to TorchScript
        run: |
          python scripts/export_v22_torchscript.py --checkpoint v22/lumen-v22-v5-fastpath-step-32500.pt --out v22/lumen-v22-step-32500.ts --step 32500 --threads 2
          test -s v22/lumen-v22-step-32500.ts
      - name: Build native Rust evaluator against CPU LibTorch
        run: cargo build --release --manifest-path rust-holdout/Cargo.toml
      - name: Run native Rust KV-cache inference at 2 intra threads
        run: |
          mkdir -p results/rust
          /usr/bin/time -f "%e" -o results/rust/wall_seconds.txt \
            rust-holdout/target/release/lumen-holdout-native \
              --model v22/lumen-v22-step-32500.ts \
              --tokenizer v22/tokenizer-v22-derived.json \
              --system system_prompt_short.txt \
              --mc-holdout oldinputs/eval/holdout_multiple_choice.jsonl \
              --freeform-holdout oldrepo/data/freeform_identity_general_100.jsonl \
              --out-dir results/rust --step 32500 --threads 2
      - name: Require exact output parity with Python main at step 32500
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          base=pathlib.Path("baseline/v22-step32500")
          rust=pathlib.Path("results/rust")
          report={"checkpoint_step":32500,"python_baseline_run":45963096256,
                  "rust_runtime":"native Rust + TorchScript KV cache; 2 intra threads"}
          py=base/"freeform_100_v22_step10000.json"
          rr=rust/"freeform_100_v22_step32500.json"
          mc_py=base/"official_holdout_2431_v22_step10000.json"
          mc_ru=rust/"official_holdout_2431_v22_step32500.json"
          if all(p.exists() for p in (py,rr,mc_py,mc_ru)):
              a,b,c,d=[json.loads(p.read_text()) for p in (py,rr,mc_py,mc_ru)]
              byid={x["id"]:x for x in a["results"]}
              rust_byid={x["id"]:x for x in b["results"]}
              target=byid["GEN-001"]; candidate=rust_byid["GEN-001"]
              report["question"]="¿Quién eres?"
              report["main_answer"]=target["response"]
              report["rust_answer"]=candidate["response"]
              report["GEN-001_token_ids_identical"]=target["token_ids"]==candidate["token_ids"]
              report["all_100_token_ids_identical"]=[x["token_ids"] for x in a["results"]]==[x["token_ids"] for x in b["results"]]
              report["all_100_text_identical"]=[x["response"] for x in a["results"]]==[x["response"] for x in b["results"]]
              sig=lambda rows:[(x["id"],x["gold"],x["pred"]) for x in rows]
              report["MC_predictions_identical"]=sig(c["predictions"])==sig(d["predictions"])
              lengths_match=len(c["predictions"])==len(d["predictions"]) and all(len(x["scores"])==len(y["scores"]) for x,y in zip(c["predictions"],d["predictions"]))
              deltas=[abs(float(x)-float(y)) for px,py in zip(c["predictions"],d["predictions"]) for x,y in zip(px["scores"],py["scores"])]
              report["MC_score_max_abs_delta"]=max(deltas,default=0.0)
              report["MC_scores_within_1e-5"]=lengths_match and report["MC_score_max_abs_delta"]<=1e-5
              report["MC_correct_main"]=c["correct"]
              report["MC_correct_rust"]=d["correct"]
              report["MC_accuracy_main"]=c["accuracy"]
              report["MC_accuracy_rust"]=d["accuracy"]
              report["holdout_hash_match"]=c["holdout_sha256"]==d["holdout_sha256"]
              report["tokenizer_hash_match"]=c["tokenizer_sha256"]==d["tokenizer_sha256"]
          else:
              report["comparison_error"]="Missing Python baseline or Rust outputs"
          meta=rust/"native_rust_metadata.json"
          if meta.exists(): report["runtime_metadata"]=json.loads(meta.read_text())
          pathlib.Path("results").mkdir(parents=True,exist_ok=True)
          pathlib.Path("results/kv_cache_main_parity.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          required=("GEN-001_token_ids_identical","all_100_token_ids_identical","all_100_text_identical",
                    "MC_predictions_identical","MC_scores_within_1e-5","holdout_hash_match","tokenizer_hash_match")
          failed=[k for k in required if report.get(k) is not True]
          if failed: raise SystemExit("Parity check failed: "+", ".join(failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-native-rust-kv-cache-holdout-step32500
          path: |
            results/
            v22/lumen-v22-step-32500.ts
          if-no-files-found: warn
          retention-days: 90
