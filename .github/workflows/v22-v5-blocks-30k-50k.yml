name: LUMEN V2.2 V5 resumable 2.5k blocks (30k-50k)
run-name: LUMEN V2.2 V5 — ${{ github.ref_name }} — 30k to 50k in 2.5k blocks
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v22-v5-blocks-30k-50k.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumen-v22-v5-blocks-30k-50k
  cancel-in-progress: false
jobs:
  step_32500:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "1"
      OPENBLAS_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      START_STEP: "30000"
      STEPS: "2500"
      PARENT_CHECKPOINT: "artifacts/lumen-v22-v5-optimized-step-30000.pt"
      V5_ARCHIVE: "artifacts/wise-ronin-corpus-v5.0.0.zip"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore frozen V5 corpus cache
        uses: actions/cache@v4
        with:
          path: artifacts/wise-ronin-corpus-v5.0.0.zip
          key: wise-ronin-v5-8b56fcace9c025880193d55c13ceaec01b09f99e8055f9961b558da00dd788ba
      - name: Restore Python wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lumen-torch-cpu-py311-v1
      - name: Download verified step-30000 parent checkpoint
        run: |
          mkdir -p artifacts/parent-download
          gh run download 45864387501 --repo orbitalronin94/Wiselumen --name lumen-v22-step-30000 --dir artifacts/parent-download
          PARENT_FILE="$(find artifacts/parent-download -type f -name 'lumen-v22-step-30000.pt' -print -quit)"
          test -n "$PARENT_FILE"
          cp "$PARENT_FILE" "$PARENT_CHECKPOINT"
          TOKENIZER_FILE="$(find artifacts/parent-download -type f -name 'tokenizer-v22-derived.json' -print -quit)"
          test -n "$TOKENIZER_FILE"
          cp "$TOKENIZER_FILE" artifacts/tokenizer-v22-derived.json
      - name: Download V5 corpus on cache miss
        run: |
          if [ ! -s "$V5_ARCHIVE" ]; then
            mkdir -p artifacts/v5-download
            gh run download 45892282767 --repo orbitalronin94/Wiselumen --name wise-ronin-corpus-v5.0.0 --dir artifacts/v5-download
            V5_FILE="$(find artifacts/v5-download -type f -name 'wise-ronin-corpus-v5.0.0.zip' -print -quit)"
            test -n "$V5_FILE"
            cp "$V5_FILE" "$V5_ARCHIVE"
          fi
          echo "8b56fcace9c025880193d55c13ceaec01b09f99e8055f9961b558da00dd788ba  $V5_ARCHIVE" | sha256sum -c -
      - name: Install CPU PyTorch and tokenizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Train exactly 2,500 steps
        run: python scripts/train_v22_v5_blocks.py
      - name: Upload resumable checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-v5-optimized-step-32500
          path: |
            artifacts/lumen-v22-v5-optimized-step-32500.pt
            artifacts/metrics-v5-optimized-step-32500.json
            artifacts/tokenizer-v22-derived.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
