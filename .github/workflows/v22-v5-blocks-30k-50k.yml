name: LUMEN V2.2 V5 FASTPATH — 32.5k to 50k (2.5k blocks)
run-name: LUMEN V2.2 FASTPATH — 32.5k to 50k — 4 intra / 4 inter
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v22-v5-blocks-30k-50k.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumen-v22-v5-fastpath-30k-50k
  cancel-in-progress: false
jobs:
  step_35000:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      START_STEP: "32500"
      STEPS: "2500"
      SCHEDULE_TOTAL_STEPS: "50000"
      LR_SCALE: "0.80"
      PARENT_CHECKPOINT: "artifacts/lumen-v22-v5-fastpath-step-32500.pt"
      PREPARED_DATA: "artifacts/prepared-v5-training-data.pt"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore verified 32.5k checkpoint and prepared V5 pools
        uses: actions/download-artifact@v4
        with:
          name: lumen-v22-v5-fastpath-step-32500
          run-id: 45953893078
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: orbitalronin94/Wiselumen
          path: artifacts
      - name: Install CPU PyTorch and tokenizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers==0.21.0
      - name: Train exactly 2,500 steps (32500 → 35000)
        run: python scripts/train_v22_v5_fastpath.py
      - name: Upload resumable checkpoint, metrics and prepared data
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-v5-fastpath-step-35000
          path: |
            artifacts/lumen-v22-v5-fastpath-step-35000.pt
            artifacts/metrics-v5-fastpath-step-35000.json
            artifacts/prepared-v5-training-data.pt
            artifacts/tokenizer-v22-derived.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  step_37500:
    needs: step_35000
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
