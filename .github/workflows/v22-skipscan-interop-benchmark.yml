name: LUMEN V2.2 - skip-scan inter-op sweep (9 intra-op)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  benchmark:
    name: 9 intra-op / ${{ matrix.interop }} inter-op
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        interop: [1, 2, 4, 8, 16]
    env:
      OMP_NUM_THREADS: "9"
      MKL_NUM_THREADS: "9"
      TORCH_${{ matrix.interop }}_THREADS: "${{ matrix.interop }}"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Paired 50 + 50 benchmark against MAIN
        run: python scripts/benchmark_v22_skipscan_interop.py --interop "${{ matrix.interop }}"
      - name: Upload paired metrics
        if: always() && hashFiles('interop-benchmark-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-skipscan-interop-${{ matrix.interop }}
          path: interop-benchmark-result.json
          retention-days: 30
