name: LUMEN V2.2 legacy holdout — Rust pipeline
run-name: V2.2 legacy holdout via Rust pipeline — step 10000
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v22-rust-legacy-holdout-step10000
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: orbitalronin94/WISE-RONIN
          ref: d2981fdb01f18e88d2c46a7dc47daea6a6e7e3ea
          path: oldrepo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Download exact V2.2 step-10000 checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p v22
          gh run download 45783991902 --repo orbitalronin94/Wiselumen --name lumen-v22-step-10000 --dir v22
          test -s v22/lumen-v22-step-10000.pt
          test -s v22/tokenizer-v22-derived.json
      - name: Download frozen legacy holdout inputs
        uses: actions/download-artifact@v4
        with:
          name: paired-v32-inputs-1000000-45782396142
          path: oldinputs
          repository: orbitalronin94/WISE-RONIN
          run-id: 45782396142
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0 numpy
      - name: Compile Rust evaluator
        run: cargo build --release --manifest-path rust-holdout/Cargo.toml
      - name: Run Rust preflight + parity-preserving inference
        run: |
          cargo run --release --manifest-path rust-holdout/Cargo.toml -- \
            --python python \
            --script scripts/evaluate_v22_legacy_holdout.py \
            --checkpoint v22/lumen-v22-step-10000.pt \
            --tokenizer v22/tokenizer-v22-derived.json \
            --system system_prompt_short.txt \
            --mc-holdout oldinputs/eval/holdout_multiple_choice.jsonl \
            --freeform-holdout oldrepo/data/freeform_identity_general_100.jsonl \
            --out-dir results/v22-step10000-rust --step 10000 --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-rust-legacy-holdout-step10000
          path: results/
          if-no-files-found: warn
          retention-days: 90
