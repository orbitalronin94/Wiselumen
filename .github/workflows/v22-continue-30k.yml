name: LUMEN V2.2 continue from step 20000 to 30000
run-name: LUMEN V2.2 20k → 30k (LayerDrop 4/8 then 8/8)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v22-continue-30k.yml"
      - "scripts/train_v22_continue_30k.py"
      - "Train.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumen-v22-training-mainline
  cancel-in-progress: false
jobs:
  continue-to-30k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact verified step-20000 parent checkpoint
        run: |
          mkdir -p artifacts
          gh run download 45812986256 --repo orbitalronin94/Wiselumen --name lumen-v22-step-20000 --dir artifacts
          test -s artifacts/lumen-v22-step-20000.pt
          test -s artifacts/tokenizer-v22-derived.json
      - name: Verify parent checkpoint step and resumable state
        run: |
          python - <<'PY'
          import torch
          path = "artifacts/lumen-v22-step-20000.pt"
          try:
              state = torch.load(path, map_location="cpu", weights_only=False)
          except TypeError:
              state = torch.load(path, map_location="cpu")
          assert int(state.get("step", -1)) == 20000, state.get("step")
          assert isinstance(state.get("model"), dict)
          assert "optimizer" in state and "ema" in state
          print("PARENT_CHECKPOINT_OK step=20000 optimizer=present ema=present")
          PY
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Resume and train 10,000 additional steps
        run: python scripts/train_v22_continue_30k.py
      - name: Upload step-30000 checkpoint and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-step-30000
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
