name: CULTISTLUMEN-V1 Dense continuation +10k (from fixed step 1k)

on:
  push:
    paths:
      - ".github/workflows/cultistlumen-v1-dense-continue-10k.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-v1-dense-continue-10k-${{ github.run_id }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  TORCH_INTEROP_THREADS: "4"
  PROFILE: "0"
  SAMPLED_NEGATIVES: "1024"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  STEPS: "10000"
  FINAL_STEP: "11000"
  WARMUP: "100"
  BASE_LR_MAIN: "0.0008"
  BASE_LR_EMBED: "0.0004"
  BATCH_SIZE: "4"
  CTX: "256"
  MAX_CHUNKS_PER_FILE: "2048"
  PARENT_STEP_OFFSET: "1000"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/cultistlumen-v1-dense-continue-10k.yml
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Recover exact fixed 1k parent checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent artifacts/frozen
          gh run download 46020820383 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-dense-fixed-step-1000 --dir artifacts/parent
          test -s artifacts/parent/cultistlumen-v1-dense-step-1000.pt
          gh run download 45998414105 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-step-1000 --dir artifacts/frozen
          test -s artifacts/frozen/cultist-tokenizer-v1-8192.json
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  artifacts/frozen/cultist-tokenizer-v1-8192.json" | sha256sum --check
      - name: Download already-built V5 tokenized pool
        uses: actions/download-artifact@v4
        with:
          name: cultist-v1-pool-ctx256-v5
          run-id: 46001412252
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify reusable pool provenance
        run: |
          test -s artifacts/cultist-v1-pool-ctx256.pkl.gz
          test -s artifacts/cultist-v1-pool-manifest.json
          grep -q "7a80da74e5742bcb02345218bcc192d5df4c2fb705fdadb7558fde43ae9fcb59" artifacts/cultist-v1-pool-manifest.json
          echo "REUSING_PREBUILT_V5_POOL_NO_RETOKENIZATION"
      - name: Continue training from global step 1000 to 11000
        env:
          PARENT_CHECKPOINT: artifacts/parent/cultistlumen-v1-dense-step-1000.pt
        run: python scripts/train_cultist_v1_dense.py
      - name: Upload step 11000 checkpoint and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cultistlumen-v1-dense-fixed-step-11000
          path: |
            artifacts/cultistlumen-v1-dense-step-11000.pt
            artifacts/cultistlumen-v1-dense-metrics-step-11000.json
            artifacts/cultist-v1-pool-manifest.json
            artifacts/frozen/cultist-tokenizer-v1-8192.json
          if-no-files-found: warn
          retention-days: 90

# Trigger this one-off continuation; dispatch remains available for future manual runs.
