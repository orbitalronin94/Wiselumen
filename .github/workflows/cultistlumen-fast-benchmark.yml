name: CULTISTLUMEN FAST-512 — train from step 0 to 10k

on:
  push:
    branches: [cultistlumen-v1-250m]
    paths:
      - 'scripts/cultistlumen_v1_fast.py'
      - 'scripts/train_cultist_v1_fast_benchmark.py'
      - '.github/workflows/cultistlumen-fast-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-fast-benchmark
  cancel-in-progress: false

jobs:
  prepare-frozen-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TORCH_INTEROP_THREADS: "1"
      STEPS: "10000"
      BATCH_SIZE: "2"
      CTX: "128"
      POOL_ARCHIVE: "artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz"
      MAX_CHUNKS_PER_FILE: "2048"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.18"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Recover and verify frozen tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/frozen
          gh run download 45998414105 --repo "$GITHUB_REPOSITORY" --name cultistlumen-v1-step-1000 --dir artifacts/frozen
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  artifacts/frozen/cultist-tokenizer-v1-8192.json" | sha256sum --check
      - name: Download and verify factual pre-Marper V4
        run: |
          curl -fL --retry 3 "https://github.com/orbitalronin94/WISE-RONIN/releases/download/corpus-v4.0.0-public-20261125/wise-ronin-corpus-v4.0.0.zip" -o artifacts/wise-ronin-corpus-v4.0.0.zip
          echo "535ae5a1c067f30a93e1ad20e0a8b7e332df5b14558d1dfac7a3e44193de3e9a  artifacts/wise-ronin-corpus-v4.0.0.zip" | sha256sum --check
      - name: Build frozen token pool once
        run: |
          python -m py_compile scripts/train_cultist_v1_sparse_premarper.py
          python scripts/train_cultist_v1_sparse_premarper.py --build-pool-only
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz")
          m=json.loads(Path("artifacts/cultist-v1-premarper-pool-manifest.json").read_text())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest==m["pool_sha256"], "pool hash mismatch"
          assert m["sampling"]=={"world":1.0,"marper":0.0,"conflicts":0.0}
          print("FROZEN_POOL",digest,p.stat().st_size)
          PY
          python -m pip freeze > artifacts/pip-freeze.txt
      - name: Upload small immutable benchmark inputs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: cultistlumen-fast-frozen-inputs
          path: |
            artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz
            artifacts/cultist-v1-premarper-pool-manifest.json
            artifacts/frozen/cultist-tokenizer-v1-8192.json
            artifacts/pip-freeze.txt
          if-no-files-found: error
          retention-days: 90

  benchmark:
    needs: prepare-frozen-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: FAST512_M512_F2048_R64
            d_model: "512"
            d_ff: "2048"
            rank: "64"
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TORCH_INTEROP_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      PROFILE: "0"
      STEPS: "10000"
      TOTAL_TRAIN_STEPS: "10000"
      WARMUP: "200"
      BASE_LR_MAIN: "0.0008"
      BASE_LR_EMBED: "0.0004"
      BATCH_SIZE: "2"
      CTX: "128"
      SAMPLED_NEGATIVES: "256"
      MODEL_D_MODEL: ${{ matrix.d_model }}
      MODEL_D_FF: ${{ matrix.d_ff }}
      MODEL_RANK: ${{ matrix.rank }}
      MODEL_N_HEAD: "0"
      POOL_ARCHIVE: "artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz"
      FROZEN_TOKENIZER: "artifacts/frozen/cultist-tokenizer-v1-8192.json"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.18"
      - name: Download frozen benchmark inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cultistlumen-fast-frozen-inputs
          path: artifacts
      - name: Restore exact Python environment and verify inputs
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r artifacts/pip-freeze.txt
          test -s artifacts/frozen/cultist-tokenizer-v1-8192.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path(os.environ["POOL_ARCHIVE"])
          m=json.loads(Path("artifacts/cultist-v1-premarper-pool-manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["pool_sha256"]
          assert m["tokenizer_sha256"]=="91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e"
          print("FROZEN_INPUTS_VERIFIED",m["pool_sha256"])
          PY
      - name: Compile fast model and trainer
        run: python -m py_compile scripts/cultistlumen_v1_fast.py scripts/train_cultist_v1_fast_benchmark.py
      - name: Run 10-step throughput benchmark
        run: python scripts/train_cultist_v1_fast_benchmark.py
      - name: Upload benchmark checkpoint and metrics only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: cultistlumen-fast512-step-10000
          path: |
            artifacts/cultistlumen-v1-fast-step-10000.pt
            artifacts/cultistlumen-v1-fast-metrics-step-10000.json
          if-no-files-found: warn
          retention-days: 30
