name: CULTISTLUMEN-V1-DENSE holdout fijo — checkpoint 11k

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cultistlumen-v1-dense-fixed-holdout-11k.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-v1-dense-holdout-11000
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Recover exact 11k checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent artifacts/frozen
          gh run download 46021874719 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-dense-fixed-step-11000 --dir artifacts/parent
          test -s artifacts/parent/cultistlumen-v1-dense-step-11000.pt
          echo "CHECKPOINT_SHA256=$(sha256sum artifacts/parent/cultistlumen-v1-dense-step-11000.pt | cut -d' ' -f1)"
      - name: Recover and verify frozen tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45998414105 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-step-1000 --dir artifacts/frozen
          test -s artifacts/frozen/cultist-tokenizer-v1-8192.json
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  artifacts/frozen/cultist-tokenizer-v1-8192.json" | sha256sum --check
      - name: Evaluate fixed 100+20 holdout on step 11000
        run: |
          python -m py_compile scripts/cultistlumen_v1_dense.py scripts/evaluate_cultist_v1_dense_holdout.py
          python scripts/evaluate_cultist_v1_dense_holdout.py --checkpoint artifacts/parent/cultistlumen-v1-dense-step-11000.pt --checkpoint-step 11000 --tokenizer artifacts/frozen/cultist-tokenizer-v1-8192.json --threads 4 --context 256 --max-new-tokens 64 --out-dir artifacts/holdout-11000
      - name: Upload literal answers and machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cultistlumen-v1-dense-step-11000-holdout-120
          path: artifacts/holdout-11000/
          if-no-files-found: warn
          retention-days: 90
