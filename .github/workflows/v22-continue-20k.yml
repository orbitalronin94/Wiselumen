name: LUMEN V2.2 continue from step 10000 to 20000
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  continue-to-20k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified step-10000 checkpoint
        run: |
          mkdir -p artifacts
          gh run download 45783991902 --repo orbitalronin94/Wiselumen --name lumen-v22-step-10000 --dir artifacts
          test -s artifacts/lumen-v22-step-10000.pt
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Resume and train 10,000 additional steps
        run: python scripts/train_v22_continue_20k.py
      - name: Upload step-20000 checkpoint and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-step-20000
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
