name: Build and validate Corpus Maestro

on:
  pull_request:
    paths:
      - "Marper-Codice-Juntado (1).txt"
      - "data/lore_seed_v0.3.jsonl"
      - "data/corpus_master_additions_v1.0.jsonl"
      - "scripts/build_corpus_master.py"
      - "scripts/build_corpus_graph.py"
      - "scripts/validate_corpus_master.py"
      - ".github/workflows/build-corpus-master.yml"
  push:
    branches:
      - lore/archivo-de-las-contradicciones
    paths:
      - "Marper-Codice-Juntado (1).txt"
      - "data/lore_seed_v0.3.jsonl"
      - "data/corpus_master_additions_v1.0.jsonl"
      - "scripts/build_corpus_master.py"
      - "scripts/build_corpus_graph.py"
      - "scripts/validate_corpus_master.py"
      - ".github/workflows/build-corpus-master.yml"

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the unified JSONL
        run: python scripts/build_corpus_master.py
      - name: Build sparse heterogeneous matrices
        run: python scripts/build_corpus_graph.py
      - name: Validate source reconstruction, records, links and graph
        run: python scripts/validate_corpus_master.py
      - name: Upload measured Corpus Maestro and graph
        uses: actions/upload-artifact@v4
        with:
          name: corpus-maestro-v1.0
          path: |
            build/corpus_master_v1.0.jsonl
            build/corpus_master_manifest_v1.0.json
            build/corpus_graph_master_v1.0.json.gz
            build/corpus_graph_summary_v1.0.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
