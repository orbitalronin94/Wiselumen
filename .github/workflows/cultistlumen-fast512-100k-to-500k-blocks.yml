name: CULTISTLUMEN FAST-512 — 100k to 500k in 50k blocks

on:
  push:
    branches: [cultistlumen-v1-250m]
    paths:
      - '.github/workflows/cultistlumen-fast512-100k-to-500k-blocks.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-fast512-100k-to-500k
  cancel-in-progress: true

jobs:
  train-150k:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TORCH_INTEROP_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      PROFILE: "0"
      STEPS: "50000"
      TOTAL_TRAIN_STEPS: "500000"
      WARMUP: "200"
      SCHEDULE_START_STEP: "100000"
      SCHEDULE_WARMUP_STEPS: "500"
      BASE_LR_MAIN: "0.0008"
      BASE_LR_EMBED: "0.0004"
      BATCH_SIZE: "2"
      CTX: "128"
      SAMPLED_NEGATIVES: "256"
      MODEL_D_MODEL: "512"
      MODEL_D_FF: "2048"
      MODEL_RANK: "64"
      MODEL_N_HEAD: "0"
      POOL_ARCHIVE: "artifacts/cultist-v1-pool-ctx128-premarper.pkl.gz"
      FROZEN_TOKENIZER: "artifacts/frozen/cultist-tokenizer-v1-8192.json"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.18"
      - name: Recover exact 100k parent checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/parent
          gh run download 46129437846 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-fast512-continuation-to-100000 --dir artifacts/parent
          test -s artifacts/parent/cultistlumen-v1-fast-step-100000.pt
      - name: Recover frozen factual pool and tokenizer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cultistlumen-fast-frozen-inputs
          run-id: 46126706421
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Restore dependencies and verify parent contract
        run: |
          set -euo pipefail
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r artifacts/pip-freeze.txt
          python - <<'PY'
          import torch, gzip, pickle, os
          parent=torch.load("artifacts/parent/cultistlumen-v1-fast-step-100000.pt",map_location="cpu",weights_only=False)
          assert parent.get("architecture")=="CULTISTLUMEN-V1-FAST" and parent.get("step")==100000
          assert parent.get("model_config",{}).get("d_model")==512 and parent.get("ctx")==128
          assert parent.get("optimizer") is not None, "Parent must carry AdamW state"
          assert parent.get("tokenizer_sha256")=="91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e"
          with gzip.open(os.environ["POOL_ARCHIVE"],"rb") as f: pool=pickle.load(f)
          meta=pool["metadata"]
          assert meta["context"]==128 and meta["corpus_version"]=="v4.0.0-pre-marper"
          assert meta["sampling"]=={"world":1.0,"marper":0.0,"conflicts":0.0}
          print("PARENT_VERIFIED",parent["step"],"optimizer_state=present")
          print("FROZEN_POOL_VERIFIED",meta["corpus_version"],meta["sampling"])
          PY
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  $FROZEN_TOKENIZER" | sha256sum --check
          echo "5e564605766b0a7c7e5b4784c0bf459588ee103c014a9aa2a1007a48cc402b13  $POOL_ARCHIVE" | sha256sum --check
          python -m py_compile scripts/cultistlumen_v1_fast.py scripts/train_cultist_v1_fast_continue.py scripts/evaluate_cultistlumen_v1_fast_holdout.py
      - name: Train block 100000 to 150000
        env:
          PARENT_CHECKPOINT: "artifacts/parent/cultistlumen-v1-fast-step-100000.pt"
          PARENT_STEP_OFFSET: "100000"
          OUT_DIR: "artifacts/block-150000"
        run: python scripts/train_cultist_v1_fast_continue.py
      - name: Holdout at 150000
        run: |
          python scripts/evaluate_cultistlumen_v1_fast_holdout.py --checkpoint artifacts/block-150000/cultistlumen-v1-fast-step-150000.pt --tokenizer "$FROZEN_TOKENIZER" --checkpoint-step 150000 --threads 2 --context 128 --max-new-tokens 64 --out-dir artifacts/holdouts/step-150000
      - name: Upload checkpoint and metrics for next block
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: cultistlumen-fast512-checkpoint-step-150000
          path: |
            artifacts/block-150000/cultistlumen-v1-fast-step-150000.pt
            artifacts/block-150000/cultistlumen-v1-fast-metrics-step-150000.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - name: Upload holdout 150000
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: cultistlumen-fast512-holdout-step-150000
          path: |
            artifacts/holdouts/step-150000/HOLDOUT_CULTISTLUMEN_V1_FAST_150K.md
            artifacts/holdouts/step-150000/cultistlumen-v1-fast-step-150000-holdout.json
          if-no-files-found: warn
          retention-days: 90

