name: CULTISTLUMEN-V1-DENSE fixed mixer 1k holdout (120 prompts)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-v1-dense-holdout-1k
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Recover exact 1k checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent artifacts/frozen
          gh run download 46020820383 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-dense-fixed-step-1000 --dir artifacts/parent
          test -s artifacts/parent/cultistlumen-v1-dense-step-1000.pt
          echo "CHECKPOINT_SHA256=$(sha256sum artifacts/parent/cultistlumen-v1-dense-step-1000.pt | cut -d' ' -f1)"
      - name: Recover exact frozen tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45998414105 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-step-1000 --dir artifacts/frozen
          test -s artifacts/frozen/cultist-tokenizer-v1-8192.json
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  artifacts/frozen/cultist-tokenizer-v1-8192.json" | sha256sum --check
      - name: Evaluate fixed 100+20 holdout
        run: |
          python -m py_compile scripts/cultistlumen_v1_dense.py scripts/evaluate_cultist_v1_dense_holdout.py
          python scripts/evaluate_cultist_v1_dense_holdout.py --checkpoint artifacts/parent/cultistlumen-v1-dense-step-1000.pt --tokenizer artifacts/frozen/cultist-tokenizer-v1-8192.json --threads 4 --context 256 --max-new-tokens 64
      - name: Upload literal answers and machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cultistlumen-v1-dense-fixed-step-1000-holdout-120
          path: |
            artifacts/holdout-1k/HOLDOUT_CULTISTLUMEN_V1_DENSE_1K.md
            artifacts/holdout-1k/cultistlumen-v1-dense-step-1000-holdout.json
          if-no-files-found: warn
          retention-days: 90
