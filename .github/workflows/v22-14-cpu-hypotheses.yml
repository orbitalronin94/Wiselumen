name: LUMEN V2.2 - 14 paired CPU optimization hypotheses (10+10)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v22-14-cpu-hypotheses.yml"
      - "scripts/benchmark_v22_cpu_hypotheses.py"
      - "Model.py"
      - "Train.py"
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.hypothesis }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        hypothesis:
          - 01-topk-embedding-projection
          - 02-topk-einsum-projection
          - 03-excitability-scatter-add
          - 04-rope-cast-cache
          - 05-rope-no-stack
          - 06-rmsnorm-square
          - 07-qkv-unbind-first
          - 08-manual-causal-attention
          - 09-skip-token-range-scan
          - 10-ema-foreach
          - 11-cache-clip-parameters
          - 12-cache-active-layer-set
          - 13-logsumexp-loss-weights
          - 14-skip-disabled-autocast
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run paired 10 + 10 step benchmark
        run: python scripts/benchmark_v22_cpu_hypotheses.py --hypothesis "${{ matrix.hypothesis }}"
      - name: Upload paired metrics
        if: always() && hashFiles('benchmark-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-cpu-${{ matrix.hypothesis }}
          path: benchmark-result.json
          retention-days: 30
