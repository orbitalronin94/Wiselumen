name: LUMEN V2.2 paired 100-step hypothesis tournament
on:
  push:
    branches:
      - research/paired-100-step-benchmarks
    paths:
      - ".github/workflows/paired-100-step-tournament.yml"
      - "scripts/benchmark_paired_100.py"
      - "Model.py"
      - "Train.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-screen:
    name: ${{ matrix.hypothesis }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - hypothesis: layerdrop_4of8
            order: AB
          - hypothesis: stochastic_depth_4of6
            order: BA
          - hypothesis: topk_192
            order: AB
          - hypothesis: topk_128
            order: BA
          - hypothesis: ema_every_25
            order: AB
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      HYPOTHESIS: ${{ matrix.hypothesis }}
      PAIR_ORDER: ${{ matrix.order }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/paired-100-step-benchmarks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Validate benchmark code
        run: |
          python -m py_compile Model.py Train.py scripts/benchmark_paired_100.py
      - name: Run paired 100-step benchmark
        run: python scripts/benchmark_paired_100.py
      - name: Upload paired metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-paired-100-${{ matrix.hypothesis }}
          path: paired-benchmark-result.json
          if-no-files-found: ignore
          retention-days: 30
