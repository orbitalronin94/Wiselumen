name: CULTISTLUMEN-V1-DENSE — bloques 10k + holdout hasta 110k

on:
  push:
    paths:
      - '.github/workflows/cultistlumen-v1-dense-trajectory-110k.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cultistlumen-v1-dense-trajectory-110k
  cancel-in-progress: false

jobs:
  block_01:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "4"
      PROFILE: "0"
      SAMPLED_NEGATIVES: "1024"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      STEPS: "10000"
      FINAL_STEP: "21000"
      TOTAL_TRAIN_STEPS: "110000"
      WARMUP: "100"
      BASE_LR_MAIN: "0.0008"
      BASE_LR_EMBED: "0.0004"
      BATCH_SIZE: "4"
      CTX: "256"
      MAX_CHUNKS_PER_FILE: "2048"
      PARENT_STEP_OFFSET: "11000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Recover parent checkpoint at step 11000
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent artifacts/frozen
          gh run download 46021874719 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-dense-fixed-step-11000 --dir artifacts/parent
          test -s artifacts/parent/cultistlumen-v1-dense-step-11000.pt
      - name: Recover frozen tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/frozen
          gh run download 45998414105 --repo "${GITHUB_REPOSITORY}" --name cultistlumen-v1-step-1000 --dir artifacts/frozen
          test -s artifacts/frozen/cultist-tokenizer-v1-8192.json
          echo "91dfa25c95f07ce9e6f3eee94caeb723712d6eaa656a18162adb0d4a047e6d9e  artifacts/frozen/cultist-tokenizer-v1-8192.json" | sha256sum --check
      - name: Recover prebuilt V5 pool without retokenizing
        uses: actions/download-artifact@v4
        with:
          name: cultist-v1-pool-ctx256-v5
          run-id: 46001412252
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify V5 pool provenance
        run: |
          test -s artifacts/cultist-v1-pool-ctx256.pkl.gz
          test -s artifacts/cultist-v1-pool-manifest.json
          grep -q "7a80da74e5742bcb02345218bcc192d5df4c2fb705fdadb7558fde43ae9fcb59" artifacts/cultist-v1-pool-manifest.json
      - name: Train 11000 to 21000
        env:
          PARENT_CHECKPOINT: artifacts/parent/cultistlumen-v1-dense-step-11000.pt
        run: |
          python -m py_compile scripts/cultistlumen_v1_dense.py scripts/train_cultist_v1_dense.py scripts/evaluate_cultist_v1_dense_holdout.py
          python scripts/train_cultist_v1_dense.py
          test -s artifacts/cultistlumen-v1-dense-step-21000.pt
      - name: Run matched 120-prompt holdout at 21000
        run: |
          python scripts/evaluate_cultist_v1_dense_holdout.py --checkpoint artifacts/cultistlumen-v1-dense-step-21000.pt --checkpoint-step 21000 --tokenizer artifacts/frozen/cultist-tokenizer-v1-8192.json --threads 4 --context 256 --max-new-tokens 64 --out-dir artifacts/holdout-21000
      - name: Upload checkpoint, metrics and literal holdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cultistlumen-v1-dense-block-21000
          path: |
            artifacts/cultistlumen-v1-dense-step-21000.pt
            artifacts/cultistlumen-v1-dense-metrics-step-21000.json
            artifacts/holdout-21000/
          if-no-files-found: warn
          retention-days: 90
