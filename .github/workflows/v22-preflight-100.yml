name: LUMEN V2.2 first 100 CPU steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-100:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_INTEROP_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers==0.21.0
      - name: Verify corpus and train first 100 steps
        run: python scripts/train_v22_smoke.py
      - name: Upload checkpoint, derived tokenizer and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v22-first-100
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
