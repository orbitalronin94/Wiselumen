name: LUMEN V2.2 first-100 preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v22-preflight-100.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORPUS_URL: https://github.com/orbitalronin94/WISE-RONIN/releases/download/corpus-v4.0.0-public-20261125/wise-ronin-corpus-v4.0.0.zip
      EXPECTED_ZIP_SHA256: 535ae5a1c067f30a93e1ad20e0a8b7e332df5b14558d1dfac7a3e44193de3e9a
      EXPECTED_TOKENIZER_SHA256: d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen V4 corpus
        run: |
          curl --fail --location --retry 3 --output corpus-v4.zip "$CORPUS_URL"
          echo "$EXPECTED_ZIP_SHA256  corpus-v4.zip" | sha256sum --check
      - name: Inspect archive, manifest and tokenizer
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          from tokenizers import Tokenizer

          archive = pathlib.Path("corpus-v4.zip")
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              manifests = [n for n in names if n.endswith("manifest.json")]
              tokenizers = [n for n in names if n.endswith("tokenizer.json")]
              print("archive_entries", len(names))
              print("manifest_candidates", manifests)
              print("tokenizer_candidates", tokenizers)
              if len(manifests) != 1 or len(tokenizers) != 1:
                  raise SystemExit("Expected exactly one manifest.json and tokenizer.json")
              manifest_bytes = z.read(manifests[0])
              tokenizer_bytes = z.read(tokenizers[0])
              manifest = json.loads(manifest_bytes)
              tokenizer_sha = hashlib.sha256(tokenizer_bytes).hexdigest()
              print("manifest_keys", sorted(manifest))
              print("manifest_version", manifest.get("version"))
              print("manifest_status", manifest.get("status"))
              print("training_authorized", manifest.get("training_authorized"))
              print("tokenizer_sha256", tokenizer_sha)
              if tokenizer_sha != __import__("os").environ["EXPECTED_TOKENIZER_SHA256"]:
                  raise SystemExit("Tokenizer SHA256 mismatch")
              tokenizer_path = pathlib.Path("v4-tokenizer.json")
              tokenizer_path.write_bytes(tokenizer_bytes)
              tokenizer = Tokenizer.from_file(str(tokenizer_path))
              print("tokenizer_vocab_size", tokenizer.get_vocab_size(with_added_tokens=True))
              for token in ["[PAD]", "[EOS]", "<|system|>", "<|end_system|>",
                            "<|user|>", "<|end_user|>", "<|assistant|>",
                            "<|end_assistant|>", "<|bos|>", "<|sep|>"]:
                  print("token_id", token, tokenizer.token_to_id(token))
              print("manifest_preview", json.dumps(manifest, ensure_ascii=False)[:5000])
              if manifest.get("version") != "v4.0.0":
                  raise SystemExit("Unexpected corpus manifest version")
              if manifest.get("status") != "FROZEN_TRAINABLE":
                  raise SystemExit("Corpus is not marked FROZEN_TRAINABLE")
              if manifest.get("training_authorized") is not True:
                  raise SystemExit("Corpus manifest does not authorize training")
          PY
